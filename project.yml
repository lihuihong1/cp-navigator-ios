name: OJHelper
options:
  bundleIdPrefix: com.ojhelper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  OJHelper:
    type: application
    platform: iOS
    sources:
      - path: OJHelper
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "OJ 助手"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        NSCalendarsWriteOnlyAccessUsageDescription: "把比赛添加到你的日历，并提前 15 分钟提醒。"
        NSCalendarsUsageDescription: "把比赛添加到你的日历，并提前 15 分钟提醒。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ojhelper.ios
        PRODUCT_NAME: OJHelper
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

schemes:
  OJHelper:
    build:
      targets:
        OJHelper: all
    run:
      config: Debug
    archive:
      config: Release